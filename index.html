    .loader,.welcome{position:fixed;z-index:100;inset:0;display:grid;place-items:center;padding:25px;background:var(--bg)}.loader.done{opacity:0;visibility:hidden;transition:.4s}.center{width:min(100%,430px);text-align:center}.launch-mark{display:grid;place-items:center;width:125px;height:125px;margin:0 auto 26px;border:1px solid rgba(215,217,221,.72);border-radius:36px;background:#0D0D0D}.launch-mark svg{width:82px;overflow:visible}.draw{fill:none;stroke:var(--silver);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:170;stroke-dashoffset:170;animation:draw .7s ease forwards}.arrow{opacity:0;animation:arrow .3s .7s forwards}@keyframes draw{to{stroke-dashoffset:0}}@keyframes arrow{to{opacity:1}}.center h1{margin:0;font-size:31px}.center p{margin-top:11px;color:var(--muted);font-size:14px}.toast{position:fixed;z-index:120;bottom:102px;left:50%;max-width:calc(100% - 32px);padding:12px 14px;transform:translate(-50%,14px);border:1px solid var(--line);border-radius:13px;background:#1D1D1D;color:var(--silver);font-size:12px;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
  </style>
